- hosts: all
  gather_facts: false
  collections:
    - zpe.nodegrid
  tasks:
  - name: Add device
    zpe.nodegrid.managed_devices:
      type:
        device_type_name: 'test'
        clone_type: 'console_server_acs6000' #'cimc_ucs' # 'console_server_acs'
        protocol: 'ipmi'
        ssh_options: '-N'
        login_prompt: 'ogin'
        password_prompt: 'sword'
        command_prompt: '([[][^]]+[]][#\\$])'
        console_escape_sequence: ''
