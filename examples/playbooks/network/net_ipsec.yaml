- hosts: all
  name: Configure IPSEC
  gather_facts: false
  collections:
    - ansible.builtin
    - zpe.nodegrid
  tasks:
    - name: IPSEC config
      tags: ipsec
      zpe.nodegrid.ipsec:
        ipsec_global:
          enable_virtual_tunnel_interface: "no"
          enable_logging: "yes"
          enable_ikev1: "no"
          vrf: "wan" # lowercase VRF interface name
        ipsec_ike_profile:
          profile_name: junos_profile
          ike_version: ikev2
          phase_1_encryption: aes-cbc256
          phase_1_authentication: sha256
          phase_1_diffie-hellman_group: group_14
          phase_1_lifetime: 28800
          phase_2_authentication_protocol: esp
          phase_2_encryption: aes_cbc256
          phase_2_authentication: sha1,sha2_256
          phase_2_pfs_group: none
          phase_2_lifetime: 28800
          enable_dead_peer_detection: "yes"
          dead_peer_detection_number_of_retries: 2
          dead_peer_detection_interval: 3600
          dead_peer_detection_action: restart
          mtu: 1350
          custom_parameters: "keyingtries=0,ipsec-interface=1"
        ipsec_tunnel:
          name: junos
          initiate_tunnel: on_demand
          ike_profile: junos_profile
          custom_up_down_script: route_based_vti_updown.sh # enforce_vti_scope_as_link.sh, route_based_vti_updown.sh 
          authentication_method: pre-shared_key
          #authentication_method: rsa_key
          secret: "@ml2025"
          left_public_key: ""
          right_public_key: ""
          left_id: "192.168.1.10"
          left_address: "%eth3"
          #left_address: ip_address
          left_ip_address: 192.168.1.10
          left_source_ip_address: "2001:db7:2::1"
          left_subnet: "2001:db7:2::/96,fc01::/16,fd01::/16,2001:db8:a::/64,2001:db8:b::/64,2001:db8:c::/64"
          right_id: "192.168.1.2"
          right_address: "192.168.1.2"
          right_source_ip_address: "2001:db7:1::1"
          right_subnet: "::/0"
          enable_monitoring: "yes"
          monitoring_source_ip_address: "2001:db7:2::1"
          monitoring_destination_ip_address: "::1"
          monitoring_number_of_retries: 3
          monitoring_interval: 60
          #monitoring_action: "restart_ipsec"
          monitoring_action: "restart_tunnel"
          #monitoring_action: "failover"
          monitoring_failover_ipsec_tunnel: "nodegrid1"
