-  name: Nodegrid Software Upgrade Playbook
   hosts: all
   gather_facts: False
   collections:
     - zpe.nodegrid
   vars:
     nodegrid_iso_path: "{{ nodegrid_iso_location }}/{{ nodegrid_iso_file }}"
     nodegrid_iso_target_version: "6.0.10"

   tasks:
     - name: Get Nodegrid Facts
       zpe.nodegrid.facts:

     - name: Check if update is required
       assert:
         that:
             - nodegrid_iso_target_version == ansible_facts.about.version
         success_msg: "OK"
         fail_msg: "UPGRADE"
       ignore_errors: true
       register: upgrade

     - name: check for disk errors
       command: smartctl -a -q errorsonly /dev/sda
       become: true
       register: smartctl
       ignore_errors: true

     - name: assert that there are no ext4_errors in sda5
       assert:
         that:
           - "'' == smartctl.stdout"
         success_msg: "OK"
         fail_msg: "ERROR"
       register: smartctl_state
       ignore_errors: true

     - name: Check for ext4 error (sda5)
       command: "cat /sys/fs/ext4/sda5/errors_count"
       become: true
       register: ext4_sda5_errors
       ignore_errors: true

     - name: assert that there are no ext4_errors in sda5
       assert:
         that:
           - "'0' == ext4_sda5_errors.stdout"
         success_msg: "OK"
         fail_msg: "ERROR"
       register: sda5_state
       ignore_errors: true

     - name: Check for ext4 error (sda8)
       command: "cat /sys/fs/ext4/sda8/errors_count"
       become: true
       register: ext4_sda8_errors
       ignore_errors: true

     - name: assert that there are no ext4_errors in sda8
       assert:
         that:
          - "'0' == ext4_sda8_errors.stdout"
         success_msg: "OK"
         fail_msg: "ERROR"
       register: sda8_state
       ignore_errors: true

     - name: Show Summary
       debug:
         msg:
           - "Hostname {{ ansible_host }}"
           - "Smart Control Check {{ smartctl_state.msg }}"
           - "sda5 {{ sda5_state.msg }}"
           - "sda8 {{ sda8_state.msg }}"
           - "VERSION {{ upgrade.msg }}"

     - name: Show Summary Line
       debug:
         msg:
           - "Hostname: {{ ansible_host }}  HDD: {{ smartctl_state.msg }}  sda5: {{ sda5_state.msg }} sda8: {{ sda8_state.msg }}  VERSION: {{ upgrade.msg }}"